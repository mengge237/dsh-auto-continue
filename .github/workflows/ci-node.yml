name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 这层 CI 的契约很窄，故意如此：
#   严格项 = 干净检出上"依赖装得上 + 源码解析得过"
#   信息项 = 测试（continue-on-error，失败只告警）
# 理由：多数仓库的测试依赖本机宿主环境，干净检出上跑不了；那属于仓库自身要补的活，
# 不该让每次 push 都挂红叉。等哪个仓库的测试真能在 CI 里跑通，把 continue-on-error 去掉即可。
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 装依赖（根目录没有 package.json 就跳过）
        run: |
          if [ ! -f package.json ]; then
            echo "没有 package.json，跳过依赖安装"; exit 0
          fi
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: 语法自检 .mjs / .cjs（严格）
        run: |
          FILES=$(git ls-files '*.mjs' '*.cjs' | grep -v node_modules || true)
          if [ -z "$FILES" ]; then echo "没有 .mjs/.cjs 文件"; exit 0; fi
          echo "$FILES" | xargs -r -n1 node --check
          echo "通过，共 $(echo "$FILES" | wc -l) 个文件"

      - name: 语法自检 .js（信息性：可能是 ESM 也可能是浏览器脚本，不阻断）
        continue-on-error: true
        run: |
          FILES=$(git ls-files '*.js' | grep -v node_modules || true)
          if [ -z "$FILES" ]; then echo "没有 .js 文件"; exit 0; fi
          echo "$FILES" | xargs -r -n1 node --check

      - name: 测试（信息性：失败只告警不阻断）
        continue-on-error: true
        run: |
          if [ ! -f package.json ]; then echo "没有 package.json，跳过"; exit 0; fi
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.test?0:1)"; then
            npm test
          else
            echo "package.json 里没有 test 脚本，跳过"
          fi
